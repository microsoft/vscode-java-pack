name: "Java Pack - English Localization"
description: |
  Verify English titles/content on all seven current public webview pages,
  untranslated-text regressions, native AWT and formatter setting effects, and
  actual Help Center restoration. AutoTest checks vscode.env.language before
  steps. Reserve one of its 12 command-and-argument slots for evidence capture.

setup:
  vscodeConfig: "config/localization.json"
  locale: "en"
  extension: "redhat.java"
  extensions:
    - "vscjava.vscode-java-pack"
  workspace: "../test-fixtures/super-implementation"
  timeout: 120

steps:
  - id: "java-workspace-ready"
    action: "waitForLanguageServer"
    skipLlmVerify: true
    timeout: 180

  - id: "open-original-walkthrough"
    action: 'executeVSCodeCommand workbench.action.openWalkthrough "vscjava.vscode-java-pack#javaWelcome"'
    # VS Code owns this tab title; the pack's walkthrough heading is inside it.
    verifyEditorTab:
      title: "Welcome"
    timeout: 30

  - id: "enable-native-awt-development"
    action: "executeVSCodeCommand java.toggleAwtDevelopment true"

  # VS Code suppresses toast rendering with --enable-smoke-test-driver. Assert
  # the command's persisted effect here; real message UI remains a manual gate.
  - id: "verify-native-awt-setting"
    action: "wait 2 seconds"
    verifyFile:
      path: "~/.vscode/settings.json"
      matches: '"java\.completion\.filteredTypes"\s*:\s*\[(?![^\]]*java\.awt\.\*)[^\]]*\]'
    timeout: 20

  - id: "restore-native-awt-setting"
    action: "executeVSCodeCommand java.toggleAwtDevelopment false"

  - id: "verify-restored-native-awt-setting"
    action: "wait 2 seconds"
    verifyFile:
      path: "~/.vscode/settings.json"
      contains: '"java.awt.*"'
    timeout: 20

  - id: "invoke-walkthrough-jdk-action"
    action: "executeVSCodeCommand java.installJdk.fromWalkthrough"
    verifyEditorTab:
      title: "Install New JDK"
      active: true
    verifyWebview:
      contains:
        - "Install New JDK"
        - "Reload Window"
        - "Others"
      notContains:
        - "安装新 JDK"
        - "重新加载窗口"
    timeout: 30

  - id: "focus-workbench-after-install-jdk"
    action: "click side tab Explorer"

  - id: "open-help-center-before-reload"
    action: "executeVSCodeCommand java.welcome"
    verifyEditorTab:
      title: "Java Help Center"
      active: true
    verifyWebview:
      contains:
        - "Java Help Center"
        - "Get Started"
        - "Configure Java Runtime"
        - "Documentation"
      notContains:
        - "Java 帮助中心"
        - "开始使用"
    timeout: 30

  - id: "focus-workbench-after-help-center"
    action: "click side tab Explorer"

  - id: "verify-beginner-tips"
    action: "executeVSCodeCommand java.gettingStarted"
    verifyEditorTab:
      title: "Tips for Beginners"
      active: true
    verifyWebview:
      contains:
        - "Tips for Beginners"
        - "Quick Start"
        - "Code Editing"
        - "FAQ"
        - "Setup the Workspace"
        - "System.out.println"
      notContains:
        - "新手提示"
        - "代码编辑"
    timeout: 30

  - id: "focus-workbench-after-beginner-tips"
    action: "click side tab Explorer"

  - id: "verify-extensions-guide"
    action: "executeVSCodeCommand java.extGuide"
    verifyEditorTab:
      title: "Java Extensions Guide"
      active: true
    verifyWebview:
      contains:
        - "Basics"
        - "Frameworks"
        - "Install Selected"
        - "Install All"
        - "Language Support for Java by Red Hat"
      notContains:
        - "安装所选扩展"
        - "安装全部扩展"
    timeout: 30

  - id: "focus-workbench-after-extensions-guide"
    action: "click side tab Explorer"

  - id: "verify-overview"
    action: "executeVSCodeCommand java.overview"
    verifyEditorTab:
      title: "Java Overview"
      active: true
    verifyWebview:
      contains:
        - "Java Overview"
        - "Start"
        - "Extensions"
        - "Configuration"
      notContains:
        - "Java 概述"
        - "配置"
    timeout: 30

  - id: "focus-workbench-after-overview"
    action: "click side tab Explorer"

  - id: "verify-runtime-command-route"
    action: "executeVSCodeCommand java.runtime"
    verifyEditorTab:
      title: "Project Settings"
      active: true
    verifyWebview:
      contains:
        - "Classpath"
        - "JDK Runtime"
        - "Refresh JDKs"
        - "Find a local JDK"
      notContains:
        - "类路径"
        - "JDK 运行时"
    timeout: 30

  - id: "dismiss-transient-menu-after-runtime"
    action: "pressKey Escape"

  - id: "focus-workbench-after-runtime"
    action: "click side tab Explorer"

  # The translated palette caption exercises manifest localization and avoids
  # using the twelfth command slot, which AutoTest's evidence probe needs.
  - id: "verify-project-settings"
    action: "run command Java: Open Project Settings"
    verifyEditorTab:
      title: "Project Settings"
      active: true
    verifyWebview:
      contains:
        - "Classpath"
        - "Compiler"
        - "Formatter"
        - "Sources"
        - "Libraries"
      notContains:
        - "项目设置"
        - "源代码"
    timeout: 30

  - id: "dismiss-transient-menu-after-project-settings"
    action: "pressKey Escape"

  - id: "focus-workbench-after-project-settings"
    action: "click side tab Explorer"

  # Avoid the suppressed native formatter-profile prompt; assert the actual
  # webview checkbox action and its language-scoped persisted effect instead.
  - id: "create-formatter-profile"
    action: |
      insertLineInFile .vscode/java-formatter.xml 1 <?xml version="1.0" encoding="UTF-8" standalone="no"?>
      <profiles version="20">
          <profile kind="CodeFormatterProfile" name="localization" version="20">
              <setting id="org.eclipse.jdt.core.formatter.tabulation.size" value="4"/>
          </profile>
      </profiles>
    verifyFile:
      path: "~/.vscode/java-formatter.xml"
      contains: 'id="org.eclipse.jdt.core.formatter.tabulation.size" value="4"'
    skipLlmVerify: true

  - id: "verify-formatter-settings"
    action: "executeVSCodeCommand java.formatterSettings"
    verifyEditorTab:
      title: "java-formatter.xml"
      active: true
    verifyWebview:
      contains:
        - "Java Formatter Settings"
        - "Indentation"
        - "Blank Lines"
        - "Comment"
        - "Wrapping"
        - "Detect indentation from file content"
      notContains:
        - "Java 格式化程序设置"
        - "从文件内容检测缩进"
    timeout: 45

  - id: "disable-formatter-detect-indentation"
    action: 'clickInWebview input[id="editor.detectIndentation"]'
    verifyFile:
      path: "~/.vscode/settings.json"
      matches: '"\[java\]"\s*:\s*\{[^}]*"editor\.detectIndentation"\s*:\s*false'
    timeout: 20

  - id: "restore-formatter-detect-indentation"
    action: 'clickInWebview input[id="editor.detectIndentation"]'
    verifyFile:
      path: "~/.vscode/settings.json"
      matches: '"\[java\]"\s*:\s*\{[^}]*"editor\.detectIndentation"\s*:\s*true'
    timeout: 20

  - id: "focus-workbench-after-formatter"
    action: "click side tab Explorer"

  - id: "focus-help-center-before-reload"
    action: "executeVSCodeCommand java.welcome"
    verifyEditorTab:
      title: "Java Help Center"
      active: true
    verifyWebview:
      contains: "Get Started"
      notContains: "开始使用"
    timeout: 30

  - id: "focus-workbench-before-reload"
    action: "click side tab Explorer"

  - id: "reload-help-center"
    action: "executeVSCodeCommand workbench.action.reloadWindow"
    timeout: 60

  - id: "verify-restored-help-center"
    action: "wait 3 seconds"
    verifyEditorTab:
      title: "Java Help Center"
      active: true
    verifyWebview:
      contains:
        - "Java Help Center"
        - "Get Started"
      notContains:
        - "Java 帮助中心"
        - "开始使用"
    timeout: 45
