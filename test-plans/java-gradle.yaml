# Gradle 8.5 compatibility: the importer/daemon and project use JDK 21.
# The language server uses redhat.java's bundled JDK, independently of Gradle.
# Prerequisites: JDK 21, JAVA21_HOME, and Gradle 8.5 on PATH (provisioned by CI).
# CI binds absolute Node/Gradle/JDK paths and saves diagnostics in test-results.
# Explicit JDK selection is intentional; this does not test automatic fallback.

name: "Java Gradle Project — Gradle 8.5 with JDK 21"
description: |
  Import a Gradle 8.5 project using JDK 21 for the Gradle daemon.
  Verify the Gradle model, Java 21 source level and dependency-backed completion,
  then build and run the saved project with Java 21 bytecode.
  The incomplete completion probe may temporarily produce a diagnostic;
  it is removed and saved before the final zero-error and build checks.

setup:
  extension: "redhat.java"
  extensions:
    - "vscjava.vscode-java-pack"
  vscodeVersion: "stable"
  workspace: "../test-fixtures/gradle-import"
  timeout: 180
  settings:
    java.help.showReleaseNotes: false
    java.help.firstView: "none"
    java.configuration.updateBuildConfiguration: "automatic"
    java.configuration.runtimes:
      - name: "JavaSE-21"
        path: "C:\\Program Files\\Java\\jdk-21"
        default: true
    java.import.maven.enabled: false
    java.import.gradle.enabled: true
    java.import.gradle.wrapper.enabled: false
    java.import.gradle.version: "8.5"
    java.import.gradle.java.home: "C:\\Program Files\\Java\\jdk-21"
    java.import.gradle.arguments:
      - "-PjavaRelease=21"
    java.import.generatesMetadataFilesAtProjectRoot: true

steps:
  - id: "ls-ready"
    action: "waitForLanguageServer"
    verifyProblems:
      errors: 0
    timeout: 300
    skipLlmVerify: true

  - id: "verify-gradle-model"
    action: "open file GradleSmoke21.java"
    verifyFile:
      path: "~/.project"
      matches: '<nature>(org\.eclipse\.buildship\.core\.gradleprojectnature|com\.microsoft\.gradle\.bs\.importer\.GradleBuildServerProjectNature)</nature>'
    skipLlmVerify: true

  - id: "verify-java-source"
    action: "waitForLanguageServer"
    verifyEditorTab:
      title: "GradleSmoke21.java"
      active: true
    verifyFile:
      path: "~/.settings/org.eclipse.jdt.core.prefs"
      contains: "org.eclipse.jdt.core.compiler.source=21"
    verifyProblems:
      errors: 0
    timeout: 15

  - id: "verify-gradle-classpath"
    action: "saveFile"
    verifyFile:
      path: "~/.classpath"
      matches: 'org\.eclipse\.buildship\.core\.gradleclasspathcontainer|commons-lang3-3\.18\.0\.jar'
    skipLlmVerify: true

  # capitalize is absent from both fixture sources, so a word suggestion
  # from existing source text cannot satisfy this dependency completion check.
  - id: "insert-dependency-probe"
    action: "insertLineInFile src/java21/example/GradleSmoke21.java 8 String probe = StringUtils.cap;"
    verifyFile:
      path: "~/src/java21/example/GradleSmoke21.java"
      contains: "String probe = StringUtils.cap;"
    skipLlmVerify: true

  - id: "select-completion-line"
    action: "goToLine 8"
    verifyEditorTab:
      title: "GradleSmoke21.java"
      active: true

  - id: "move-to-probe-end"
    action: "executeVSCodeCommand cursorEnd"

  - id: "move-before-semicolon"
    action: "pressKey ArrowLeft"

  - id: "verify-dependency-completion"
    action: "triggerCompletion"
    verifyCompletion:
      contains: ["capitalize"]

  - id: "dismiss-completion"
    action: "pressKey Escape"

  - id: "select-probe-line"
    action: "goToLine 8"

  - id: "remove-dependency-probe"
    action: "executeVSCodeCommand editor.action.deleteLines"

  - id: "save-source"
    action: "saveFile"
    verifyFile:
      path: "~/src/java21/example/GradleSmoke21.java"
      matches: '^(?![\s\S]*String probe = StringUtils\.cap;)'
    skipLlmVerify: true

  - id: "open-build-terminal"
    action: 'executeVSCodeCommand workbench.action.terminal.new {"cwd":"${workspaceFolder}"}'
    skipLlmVerify: true

  - id: "verify-build-and-run"
    action: 'executeVSCodeCommand workbench.action.terminal.sendSequence {"text":"node verify.mjs 21 8.5\u000d"}'
    verifyTerminal:
      contains: "GRADLE_JAVA21_BUILD_PASSED"
    verifyProblems:
      errors: 0
    timeout: 300
    skipLlmVerify: true
