name: Java team-memory contract checks

on:
  pull_request:
    paths:
      - .github/actions/queue-team-memory/**
      - .github/workflows/team-memory*.yml
  push:
    branches: [main]
    paths:
      - .github/actions/queue-team-memory/**
      - .github/workflows/team-memory*.yml

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned shared actions for offline contract tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/IssueLens
          ref: a81d2d96167fc0e69ac631c2edc85f858e693289
          path: .issuelens-client
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/issuelens/
            /.github/actions/queue-team-memory/
          sparse-checkout-cone-mode: false

      - name: Check dispatch, source authorization, discovery, and receipts offline
        env:
          ISSUELENS_ACTIONS_PATH: .issuelens-client/.github/actions
        run: python3 -m unittest discover -s .github/actions/queue-team-memory/tests
