name: Public source GITHUB_TOKEN diagnostic
run-name: Public source GITHUB_TOKEN diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnostic:
    if: >-
      github.repository == 'microsoft/vscode-java-pack' &&
      github.ref == 'refs/heads/chagong-public-source-token-diagnostic' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out immutable diagnostic commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/source-token-diagnostic.py
          sparse-checkout-cone-mode: false

      - name: Test public source reads with this job's built-in token
        env:
          SOURCE_GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/source-token-diagnostic.py
