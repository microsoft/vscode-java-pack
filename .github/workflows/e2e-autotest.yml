name: E2E AutoTest

on:
  pull_request:
    branches:
      - main
  schedule:
    # Every weekday (Mon–Fri) at 13:00 Shanghai time (05:00 UTC)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      test_plan:
        description: "Test plan to run (leave empty for all)"
        required: false
        default: ""
        type: string
      vsix_urls:
        description: "VSIX URLs, GitHub release tag URLs, GitHub Actions run URLs, or redhat-developer/vscode-java run IDs, comma-separated (e.g. https://github.com/redhat-developer/vscode-java/releases/tag/v1.54.0,https://github.com/redhat-developer/vscode-java/actions/runs/28102068371,https://host/vscode-java-debug-0.58.0.vsix). Release/run inputs auto-resolve to the platform-specific VSIX for the runner OS."
        required: false
        default: ""
        type: string
      pre_release:
        description: "Install pre-release versions of marketplace extensions"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  # ── Job 1a: Build vscode-java-pack VSIX from the PR/manual branch ───────
  build-pack:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package branch VSIX
        run: npx @vscode/vsce@latest package -o vscode-java-pack-pr.vsix

      - name: Upload branch VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pack-vsix
          path: vscode-java-pack-pr.vsix
          retention-days: 1

  # ── Job 1b: Discover test plans ──────────────────────────
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      autotest_version: ${{ steps.autotest.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve AutoTest version for this run
        id: autotest
        shell: bash
        run: |
          version=$(npm view @vscjava/vscode-autotest@latest version)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid AutoTest version returned by npm: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using AutoTest $version for all jobs in this run"

      - name: Resolve test plan matrix
        id: scan
        shell: bash
        run: |
          requested="${{ inputs.test_plan }}"
          if [ -n "$requested" ]; then
            # Strip optional .yaml suffix and emit a single-entry matrix
            plan="${requested%.yaml}"
            matrix=$(printf '%s' "$plan" | jq -R . | jq -sc .)
          else
            matrix=$(ls test-plans/*.yaml | xargs -I{} basename {} .yaml | grep -v java-fresh-import | jq -R . | jq -sc .)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Found plans: $matrix"

  # Prepare supplied bits once, independently of the test matrix.
  prepare-bits:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vsix_urls != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test VSIX preparation
        shell: pwsh
        run: ./.github/scripts/test-prepare-vsix.ps1

      - name: Prepare platform VSIX files
        shell: pwsh
        env:
          VSIX_SOURCES: ${{ inputs.vsix_urls }}
          GITHUB_TOKEN: ${{ github.token }}
          VSCODE_JAVA_ARTIFACT_TOKEN: ${{ secrets.VSCODE_JAVA_ARTIFACT_TOKEN }}
        run: ./.github/scripts/prepare-vsix.ps1 -Sources $env:VSIX_SOURCES -OutputDirectory prepared-vsix

      - name: Upload Windows bits
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: override-vsix-Windows-X64
          path: prepared-vsix/win32-x64/*.vsix
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

      - name: Upload Linux bits
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: override-vsix-Linux-X64
          path: prepared-vsix/linux-x64/*.vsix
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

      - name: Upload macOS bits
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: override-vsix-macOS-ARM64
          path: prepared-vsix/darwin-arm64/*.vsix
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  # ── Job 2: Run each test plan in parallel ───────────────
  e2e-test:
    needs: [discover, build-pack, prepare-bits]
    # build-pack is skipped on schedule; PR/manual runs install this branch's pack VSIX first.
    # Skipped preparation is allowed only without overrides; failure must not fall back to Marketplace.
    if: ${{ always() && needs.discover.result == 'success' && (github.event_name == 'schedule' || needs.build-pack.result == 'success') && (needs.prepare-bits.result == 'success' || (needs.prepare-bits.result == 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.vsix_urls == ''))) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        plan: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone vscode-java (test projects)
        run: git clone --depth 1 https://github.com/redhat-developer/vscode-java.git ../vscode-java

      - name: Clone eclipse.jdt.ls (Gradle test projects)
        run: git clone --depth 1 https://github.com/eclipse-jdtls/eclipse.jdt.ls.git ../eclipse.jdt.ls

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Java 25 (for java25 test plans)
        if: contains(matrix.plan, 'java25')
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25-ea

      - name: Configure JDK 25 path for runner OS
        if: contains(matrix.plan, 'java25')
        shell: pwsh
        run: |
          "JAVA25_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          $planFile = "test-plans/${{ matrix.plan }}.yaml"
          if ($IsWindows) {
            $target = "C:\Program Files\Java\jdk-25"
            New-Item -ItemType Junction -Path $target -Target $env:JAVA_HOME -Force | Out-Null
            Write-Host "Created junction: $target -> $env:JAVA_HOME"
          } else {
            # Linux and macOS: symlink JAVA_HOME to a known location and
            # rewrite the Windows-style java.jdt.ls.java.home in the plan
            # so the language server resolves JDK 25 on this runner.
            $target = "/opt/jdk-25"
            sudo mkdir -p /opt
            sudo ln -sfn $env:JAVA_HOME $target
            Write-Host "Created symlink: $target -> $env:JAVA_HOME"
            (Get-Content $planFile -Raw) -replace 'C:\\\\Program Files\\\\Java\\\\jdk-25', $target | Set-Content $planFile
            Write-Host "Patched $planFile java.jdt.ls.java.home -> $target"
          }

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Configure JDK 21 for Gradle import tests
        if: matrix.plan == 'java-gradle' || matrix.plan == 'java-gradle-java25'
        shell: pwsh
        run: |
          "JAVA21_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          if ("${{ matrix.plan }}" -eq "java-gradle") {
            $planFile = "test-plans/${{ matrix.plan }}.yaml"
            # JSON escaping also handles Windows installation paths in double-quoted YAML.
            $jdkPath = ($env:JAVA_HOME | ConvertTo-Json -Compress).Trim('"')
            (Get-Content $planFile -Raw).Replace('C:\\Program Files\\Java\\jdk-21', $jdkPath) | Set-Content $planFile
          }

      - name: Setup matching Gradle CLI for import tests
        if: matrix.plan == 'java-gradle' || matrix.plan == 'java-gradle-java25'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ matrix.plan == 'java-gradle-java25' && '9.8.1' || '8.5' }}

      - name: Test Gradle toolchain binding
        if: matrix.plan == 'java-gradle' || matrix.plan == 'java-gradle-java25'
        run: node --test tests/gradle-toolchain.test.js

      - name: Bind CI toolchain for Gradle import tests
        if: matrix.plan == 'java-gradle' || matrix.plan == 'java-gradle-java25'
        shell: pwsh
        env:
          GRADLE_TEST_PLAN: ${{ matrix.plan }}
        run: ./.github/scripts/bind-gradle-toolchain.ps1 -PlanName $env:GRADLE_TEST_PLAN

      - name: Install resolved AutoTest CLI
        run: |
          npm install -g "@vscjava/vscode-autotest@${{ needs.discover.outputs.autotest_version }}"
          npm list -g @vscjava/vscode-autotest --depth=0

      - name: Setup virtual display (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb is not preinstalled; installing it with bounded apt operations."
            apt_options=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
            )
            if ! sudo timeout 120s apt-get "${apt_options[@]}" update; then
              echo "::error::Timed out while refreshing apt metadata for Xvfb."
              exit 1
            fi
            if ! sudo timeout 120s apt-get "${apt_options[@]}" install -y --no-install-recommends xvfb; then
              echo "::error::Timed out while installing Xvfb."
              exit 1
            fi
          fi

          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb_pid=$!
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Give Xvfb a moment to start before the autotest CLI launches VS Code.
          sleep 2
          if ! kill -0 "$xvfb_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/xvfb.log"
            echo "::error::Xvfb failed to start."
            exit 1
          fi

      - name: Download vscode-java-pack VSIX (from branch)
        if: ${{ github.event_name != 'schedule' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack-vsix
          path: vsix

      - name: Download prepared platform VSIX files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.vsix_urls != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: override-vsix-${{ runner.os }}-${{ runner.arch }}
          path: vsix

      - name: Use vscode-java-pack as primary extension for VSIX override runs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.vsix_urls != '' }}
        shell: pwsh
        run: |
          $planFile = "test-plans/${{ matrix.plan }}.yaml"
          $content = Get-Content $planFile -Raw
          $content = $content -replace '(?m)^(\s*)extension:\s*"?redhat\.java"?\s*$', '$1extension: "vscjava.vscode-java-pack"'
          $content = $content -replace '(?m)^(\s*)extensions:\s*\r?\n\1\s*-\s*"vscjava\.vscode-java-pack"\s*\r?\n', ''
          Set-Content $planFile $content
          Write-Host "Patched $planFile to install vscode-java through vscode-java-pack before applying VSIX overrides."

      - name: Run ${{ matrix.plan }}
        shell: pwsh
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          $autotestArgs = @(
            "run",
            "test-plans/${{ matrix.plan }}.yaml",
            "--analysis-mode",
            "case"
          )
          if (Test-Path vsix) {
            $vsixFiles = (Get-ChildItem vsix -Filter "*.vsix" |
              Sort-Object @{ Expression = { if ($_.Name -like "vscode-java-pack*") { 0 } else { 1 } } }, Name |
              ForEach-Object { $_.FullName }) -join ","
            if ($vsixFiles) { $autotestArgs += @("--vsix", $vsixFiles) }
          }

          # PR/manual runs test the branch-built pack VSIX first, then any
          # supplied VSIX overrides such as a vscode-java Actions run artifact.
          # Case mode always captures the evidence bundle. LLM verification and
          # case analysis activate when AZURE_OPENAI_* secrets are available;
          # runs without secret access retain the evidence and record the
          # unavailable analysis without changing the test verdict.
          # Scheduled & manual runs default to --pre-release unless explicitly disabled.
          $isPR = "${{ github.event_name }}" -eq "pull_request"
          if (-not $isPR -and "${{ inputs.pre_release }}" -ne "false") {
            $autotestArgs += "--pre-release"
          }

          Write-Host "Running: autotest $($autotestArgs -join ' ')"
          & autotest @autotestArgs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.plan }}-${{ matrix.os }}
          path: test-results/
          retention-days: 30

  # ── Job 3: Aggregate analysis ───────────────────────────
  analyze:
    if: ${{ always() && needs.discover.result == 'success' && needs.e2e-test.result != 'skipped' && github.event_name != 'pull_request' && inputs.test_plan == '' }}
    needs: [discover, e2e-test]
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install resolved AutoTest CLI
        run: |
          npm install -g "@vscjava/vscode-autotest@${{ needs.discover.outputs.autotest_version }}"
          npm list -g @vscjava/vscode-autotest --depth=0

      - name: Download all results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          path: all-results
          merge-multiple: false

      - name: Organize results
        run: |
          mkdir -p test-results
          # Each artifact is named results-<plan>-<os>; keep that suffix so
          # Windows and Linux runs of the same plan don't collide.
          for dir in all-results/results-*/; do
            artifact=$(basename "$dir")          # results-<plan>-<os>
            suffix="${artifact#results-}"        # <plan>-<os>
            find "$dir" -name "results.json" -exec dirname {} \; | while read d; do
              cp -r "$d" "test-results/$suffix"
            done
          done
          echo "Organized results:"
          ls test-results/

      - name: Analyze results
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: autotest analyze test-results --output test-results --analysis-mode case --report-only

      - name: Write Job Summary
        if: always()
        run: |
          if [ -f test-results/summary.md ]; then
            cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-aggregate-summary
          path: |
            test-results/summary.md
            test-results/*/results.json
            test-results/*/analysis/
            test-results/*/evidence/manifest.json
          retention-days: 30
