name: Queue Java team memory (opt-in)

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: >-
      ${{ vars.ISSUELENS_TEAM_MEMORY_COORDINATOR_ENABLED == 'true' &&
          github.repository == 'microsoft/vscode-java-pack' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Queue team-memory update
        uses: microsoft/IssueLens/.github/actions/queue-team-memory@521b1ff80a70140e286ced7500d0b150cf9e6d6c
        with:
          coordinator-repository: microsoft/vscode-java-pack
          coordinator-workflow: team-memory-coordinator.yml
          coordinator-ref: main
          source-token: ${{ github.token }}
          dispatch-token: ${{ github.token }}
