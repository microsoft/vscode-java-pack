name: Queue Java team memory (opt-in)

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: >-
      ${{ vars.ISSUELENS_TEAM_MEMORY_COORDINATOR_ENABLED == 'true' &&
          github.repository == 'microsoft/vscode-java-pack' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Load dispatcher from trusted push revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /.github/actions/queue-team-memory/
          sparse-checkout-cone-mode: false

      - name: Queue team-memory update
        uses: ./.github/actions/queue-team-memory
